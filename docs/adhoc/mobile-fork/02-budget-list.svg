  <!-- Annotations -->
  <text x="0" y="838" font-size="10" fill="#a1a1aa">Tapping any row is client-state navigation (a "step" union), not a route change &#8212;</text>
  <text x="0" y="854" font-size="10" fill="#a1a1aa">same MobileStackedDemo pattern Tally's own mobile tree follows. Footer stays</text>
  <text x="0" y="870" font-size="10" fill="#a1a1aa">pinned and "Budget" stays active through the drill-down (see next screen).</text>
</svg>
