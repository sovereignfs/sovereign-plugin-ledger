  <rect x="322" y="759" width="14" height="18" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
  <line x1="325" y1="764" x2="333" y2="764" stroke="#a1a1aa" stroke-width="1"/>
  <line x1="325" y1="769" x2="333" y2="769" stroke="#a1a1aa" stroke-width="1"/>
