<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="900" fill="#fafafa"/>

  <!-- Dimmed background shell (Dialog's scrim covers the FULL viewport, sidebar included) -->
  <rect x="0" y="0" width="240" height="900" fill="#f4f4f5" opacity="0.6"/>
  <text x="24" y="40" font-size="20" font-weight="700" fill="#18181b" opacity="0.35">Ledger</text>
  <rect x="16" y="60" width="208" height="40" rx="8" fill="#18181b" opacity="0.3"/>
  <text x="34" y="85" font-size="14" font-weight="600" fill="#ffffff" opacity="0.6">+ Add expense</text>
  <text x="34" y="157" font-size="14" fill="#52525b" opacity="0.35">Overview</text>
  <text x="34" y="205" font-size="14" fill="#52525b" opacity="0.35">Budget</text>
  <text x="34" y="253" font-size="14" fill="#52525b" opacity="0.35">Accounts</text>
  <text x="34" y="301" font-size="14" fill="#52525b" opacity="0.35">Reports</text>
  <text x="280" y="56" font-size="24" font-weight="700" fill="#18181b" opacity="0.2">Overview</text>
  <rect x="0" y="0" width="1200" height="900" fill="#18181b" opacity="0.1"/>

  <!-- Dialog panel: size="md" — 36rem (576px) fixed width, content-driven height, centered -->
  <rect x="312" y="166" width="576" height="568" rx="12" fill="#ffffff" stroke="#e4e4e7"/>

  <text x="344" y="214" font-size="20" font-weight="700" fill="#18181b">Add expense</text>
  <text x="856" y="214" font-size="20" fill="#71717a" text-anchor="end">&#215;</text>
  <line x1="344" y1="232" x2="856" y2="232" stroke="#e4e4e7"/>

  <!-- Amount -->
  <text x="344" y="258" font-size="12" font-weight="600" fill="#3f3f46">AMOUNT</text>
  <rect x="344" y="266" width="512" height="64" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <rect x="360" y="286" width="52" height="24" rx="6" fill="#f4f4f5" stroke="#e4e4e7"/>
  <text x="372" y="302" font-size="12" fill="#52525b">EUR &#9662;</text>
  <text x="424" y="308" font-size="26" font-weight="700" fill="#18181b">23.40</text>

  <!-- Category / Subcategory, side by side (panel is wide enough at md) -->
  <text x="344" y="354" font-size="12" font-weight="600" fill="#3f3f46">CATEGORY</text>
  <rect x="344" y="362" width="248" height="40" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="360" y="387" font-size="14" fill="#18181b">Groceries &#9662;</text>

  <text x="608" y="354" font-size="12" font-weight="600" fill="#3f3f46">SUBCATEGORY</text>
  <rect x="608" y="362" width="248" height="40" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="624" y="387" font-size="14" fill="#18181b">Essen &#9662;</text>

  <!-- Date -->
  <text x="344" y="422" font-size="12" font-weight="600" fill="#3f3f46">DATE</text>
  <rect x="344" y="430" width="512" height="40" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="360" y="455" font-size="14" fill="#18181b">Today, Aug 27</text>

  <!-- Fund from jar toggle -->
  <line x1="344" y1="488" x2="856" y2="488" stroke="#e4e4e7"/>
  <text x="344" y="516" font-size="13" fill="#3f3f46">Fund from a saving jar</text>
  <rect x="804" y="504" width="40" height="22" rx="11" fill="#e4e4e7"/>
  <circle cx="814" cy="515" r="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="344" y="534" font-size="11" fill="#a1a1aa">Off &#8212; this counts as regular spending</text>

  <!-- Note -->
  <text x="344" y="566" font-size="12" font-weight="600" fill="#3f3f46">NOTE (OPTIONAL)</text>
  <rect x="344" y="574" width="512" height="40" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="360" y="599" font-size="14" fill="#a1a1aa">Add a note&#8230;</text>

  <!-- Buttons -->
  <rect x="550" y="658" width="140" height="44" rx="8" fill="none" stroke="#d4d4d8"/>
  <text x="620" y="685" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">Cancel</text>
  <rect x="706" y="658" width="150" height="44" rx="8" fill="#18181b"/>
  <text x="781" y="685" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Add expense</text>

  <!-- Annotations -->
  <text x="280" y="862" font-size="12" fill="#a1a1aa">Corrected: Dialog (size="md", 36rem/576px, content-driven height up to a 42rem cap), not Sheet &#8212;</text>
  <text x="280" y="882" font-size="12" fill="#a1a1aa">Sheet only slides from bottom/top and has no desktop equivalent. The scrim now dims the full viewport, sidebar included.</text>
</svg>
