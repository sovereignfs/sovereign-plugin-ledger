<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="900" fill="#fafafa"/>

  <text x="48" y="56" font-size="18" font-weight="700" fill="#18181b">Ledger</text>

  <!-- Progress: step 2 of 3 -->
  <rect x="520" y="176" width="48" height="4" rx="2" fill="#18181b"/>
  <rect x="576" y="176" width="48" height="4" rx="2" fill="#18181b"/>
  <rect x="632" y="176" width="48" height="4" rx="2" fill="#e4e4e7"/>
  <text x="600" y="204" font-size="12" fill="#a1a1aa" text-anchor="middle">Step 2 of 3</text>

  <text x="600" y="248" font-size="28" font-weight="700" fill="#18181b" text-anchor="middle">What's your primary monthly income?</text>
  <text x="600" y="276" font-size="14" fill="#71717a" text-anchor="middle">Your main paycheck or salary, after tax. Add more income sources anytime.</text>

  <rect x="340" y="320" width="520" height="72" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <rect x="364" y="344" width="56" height="24" rx="6" fill="#f4f4f5" stroke="#e4e4e7"/>
  <text x="378" y="360" font-size="12" fill="#52525b">EUR</text>
  <text x="436" y="366" font-size="28" font-weight="700" fill="#18181b">4,200.00</text>

  <rect x="340" y="430" width="520" height="48" rx="8" fill="#18181b"/>
  <text x="600" y="459" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Continue</text>

  <text x="600" y="498" font-size="13" fill="#71717a" text-anchor="middle">&#8592; Back</text>

  <!-- Annotations -->
  <text x="280" y="862" font-size="12" fill="#a1a1aa">Amount uses CurrencyInput, pre-set to the currency chosen in step 1. Left genuinely blank</text>
  <text x="280" y="882" font-size="12" fill="#a1a1aa">by default (shown filled here) &#8212; income has no sensible platform-wide default to suggest.</text>
